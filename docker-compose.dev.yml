services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wewe_rss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - 54330:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wewe_rss"]
      timeout: 10s
      interval: 5s
      retries: 10

volumes:
  postgres_data:
