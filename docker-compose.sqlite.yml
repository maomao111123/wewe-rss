services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wewe_rss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - 54330:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wewe_rss"]
      timeout: 10s
      interval: 5s
      retries: 10

  import-sqlite:
    build:
      context: .
      target: app
    image: wewe-rss:local
    command: ["pnpm", "db:import:sqlite"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wewe_rss?schema=public
      SQLITE_IMPORT_PATH: /sqlite/wewe-rss.db
    volumes:
      - ./apps/server/data:/sqlite:ro
    profiles:
      - import

volumes:
  postgres_data:
