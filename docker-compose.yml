services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wewe_rss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - 54330:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wewe_rss"]
      timeout: 10s
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      target: app
    image: wewe-rss:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 4000:4000
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wewe_rss?schema=public
      HOST: 0.0.0.0
      PORT: 4000
      AUTH_CODE: change-me
      SERVER_ORIGIN_URL: http://localhost:4000
      FEED_MODE: ""
      CRON_EXPRESSION: 35 5,17 * * *
      MAX_REQUEST_PER_MINUTE: 60
      UPDATE_DELAY_TIME: 60
      ENABLE_CLEAN_HTML: "false"
      PLATFORM_URL: https://weread.111965.xyz
    restart: unless-stopped

volumes:
  postgres_data:
